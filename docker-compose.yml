version: '3.8'

services:
  push:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miniflux-discord-push
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - MINIFLUX_URL=${MINIFLUX_URL:-https://miniflux.vibexcap.com}
      - MINIFLUX_TOKEN=${MINIFLUX_TOKEN}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
